<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;

            background-image: linear-gradient(
                45deg,
                rgb(255, 214, 194),
                rgb(7, 20, 59),
                rgb(255, 216, 179),
                rgb(15, 23, 56)
            );

            background-size: 400%;
            animation: gradient 5s infinite;
        }

        @keyframes gradient {
            50% {
                background-position: 100% 50%;
            }
        }

        .box {
            background-color: bisque;
            padding: 60px;
            border-radius: 15px;
            text-align: center;

           
            width: 600px;
            max-width: 100%;

            border: outset;
            border-top: 3px solid rgb(36, 36, 90);
            border-right: 3px solid rgb(36, 36, 90);
            border-bottom: 3px solid rgb(36, 36, 90);
            border-left: 3px solid rgb(36, 36, 90);
        }

        h2 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 28px;
            margin-top: 0;
        }

        p {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            line-height: 1.6;
        }

        .navbox {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .button {
            background-color: rgb(134, 80, 10);
            border: outset;
            color: white;
            padding: 15px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 20px;

            
            min-width: 100px;
        }

        .btn {
            background-color: rgb(46, 34, 19);
            border: outset;
            color: white;
            padding: 15px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-top: 20px;
            border-radius: 20px;
        }

        .btn:hover,
        .button:hover {
            transform: translateY(-5px);
            transition: transform 0.3s ease;
        }

        
        @media (max-width: 768px) {

            body {
                padding: 15px;
            }

            .box {
                width: 100%;
                padding: 40px 25px;
            }

            h2 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }

            .button {
                padding: 13px 18px;
                font-size: 15px;
            }
        }

        
        @media (max-width: 480px) {

            body {
                padding: 10px;
            }

            .box {
                padding: 30px 15px;
                border-radius: 12px;
            }

            h2 {
                font-size: 21px;
                line-height: 1.3;
            }

            p {
                font-size: 13px;
                line-height: 1.5;
            }

            .navbox {
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }

            .button {
                width: 100%;
                max-width: 220px;
                padding: 12px;
                font-size: 14px;
            }

            .btn {
                width: 100%;
                max-width: 220px;
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>

    <title>Homepage</title>
</head>

<body>

    <div class="box">

        <h2>Hi, Welcome to the Homepage</h2>

        <p>
            "The cube is a perfect metaphor for life.<br>
            It's complex, it's challenging, but it can be solved."
            <br>
            - <em>Ernő Rubik</em>
        </p>

        <div class="navbox">
            <a href="index.html" class="button">Home</a>
            <a href="About.html" class="button">About</a>
            <a href="Product.html" class="button">Product</a>
            <a href="Contact.html" class="button">Contact</a>
        </div>

        <a href="login.html" class="btn">Logout</a>

    </div>

</body>
</html>
