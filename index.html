<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage | Cube Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f1f5f9;
            font-family: Arial, Helvetica, sans-serif;
            color: #1e293b;
        }

        .navbox {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            padding: 18px 15px;
            flex-wrap: wrap;
            background-color: #172554;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .button,
        .btn {
            color: #ffffff;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            border-radius: 8px;
            border: 1px solid #475569;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button {
            background-color: #334155;
        }

        .btn {
            background-color: #b91c1c;
            border-color: #b91c1c;
        }

        .button:hover {
            background-color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background-color: #991b1b;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .box {
            background-color: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 800px;
            margin: 80px auto;
            border: 1px solid #e2e8f0;
            box-shadow: 0 5px 20px rgba(23, 37, 84, 0.06);
        }

        h2 {
            color: #172554;
            font-size: 30px;
            line-height: 1.4;
            margin-top: 0;
            margin-bottom: 25px;
        }

        p {
            color: #475569;
            font-size: 18px;
            line-height: 1.8;
            margin: 0 0 30px;
        }

        em {
            color: #1d4ed8;
            font-weight: bold;
        }

        .logout-container {
            margin-top: 25px;
        }

        @media (max-width: 768px) {
            .navbox {
                gap: 8px;
                padding: 14px 10px;
            }

            .button,
            .btn {
                padding: 9px 14px;
                font-size: 14px;
            }

            .box {
                width: 92%;
                padding: 40px 25px;
                margin: 40px auto;
               
            }

            h2 {
                font-size: 25px;
            }

            p {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .navbox {
                gap: 5px;
                padding: 12px 8px;
            }

            .button,
            .btn {
                padding: 8px 10px;
                font-size: 13px;
            }

            .box {
                width: 94%;
                padding: 30px 18px;
                margin: 150px auto;
                border-radius: 10px;
                ma
            }

            h2 {
                font-size: 22px;
                margin-bottom: 20px;
            }

            p {
                font-size: 15px;
                line-height: 1.7;
            }
        }
    </style>
</head>

<body>

    <div class="navbox">
        <a href="index.html" class="button">Home</a>
        <a href="About.html" class="button">About</a>
        <a href="Product.html" class="button">Product</a>
        <a href="Contact.html" class="button">Contact</a>
        <a href="login.html" class="btn">Logout</a>
    </div>

    <div class="box">

        <h2>Hi, Welcome to the Homepage</h2>

        <p>
            "The cube is a perfect metaphor for life.
            It's complex, it's challenging, but it can be solved."
            <br>
            - <em>Ernő Rubik</em>
        </p>

    </div>

</body>
</html>
