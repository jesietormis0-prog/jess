<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f1f5f9;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        /* Navigation Bar - Same as Home and About */
        .navbox {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            padding: 18px 15px;
            flex-wrap: wrap;
            background-color: #172554;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .button,
        .btn {
            color: #ffffff;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            border-radius: 8px;
            border: 1px solid #475569;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button {
            background-color: #334155;
        }

        .button:hover {
            background-color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn {
            background-color: #b91c1c;
            border-color: #b91c1c;
        }

        .btn:hover {
            background-color: #991b1b;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Contact Form Container */
        .container {
            width: 92%;
            max-width: 650px;
            margin: 40px auto;
            padding: 35px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(15, 23, 42, 0.08);
        }

        h2 {
            text-align: center;
            font-size: 30px;
            color: #172554;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 16px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            color: #1e293b;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        input[type="submit"] {
            background-color: #1d4ed8;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #1e40af;
        }

        /* Mobile Responsive */
        @media screen and (max-width: 600px) {
            .navbox {
                gap: 5px;
                padding: 12px 8px;
            }

            .button,
            .btn {
                font-size: 14px;
                padding: 8px 12px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
                padding: 22px 18px;
            }

            h2 {
                font-size: 26px;
                margin-bottom: 25px;
            }

            input[type="text"],
            select,
            textarea {
                font-size: 16px;
            }
        }

        @media screen and (max-width: 350px) {
            .container {
                padding: 16px 12px;
            }

            h2 {
                font-size: 23px;
            }

            .button,
            .btn {
                font-size: 13px;
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbox">
        <a href="index.html" class="button">Home</a>
        <a href="About.html" class="button">About</a>
        <a href="Product.html" class="button">Product</a>
        <a href="Contact.html" class="button">Contact</a>
        <a href="login.html" class="btn">Logout</a>
    </div>

    <!-- Contact Form -->
    <div class="container">

        <h2>Contact Us</h2>

        <form action="action_page.php" method="post">

            <label for="fname">First Name</label>
            <input
                type="text"
                id="fname"
                name="firstname"
                placeholder="Enter your first name"
            >

            <label for="lname">Last Name</label>
            <input
                type="text"
                id="lname"
                name="lastname"
                placeholder="Enter your last name"
            >

            <label for="country">Country / Location</label>
            <select id="country" name="country">
                <option value="Resthouse">Resthouse</option>
                <option value="Lantungan">Lantungan</option>
                <option value="Aurora">Aurora</option>
            </select>

            <label for="subject">Comment</label>
            <textarea
                id="subject"
                name="subject"
                placeholder="Write your message here..."
            ></textarea>

            <div style="text-align: center;">
                <input type="submit" value="Submit">
            </div>

        </form>

    </div>

</body>
</html>
