<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-size: 400%;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(
                45deg,
                rgb(255, 214, 194),
                rgb(7, 20, 59),
                rgb(255, 216, 179),
                rgb(15, 23, 56)
            );
            animation: gradient 5s infinite;
            font-family: Arial, Helvetica, sans-serif;
        }

        @keyframes gradient {
            50% {
                background-position: 100% 50%;
            }
        }

     
        .container {
            width: 100%;
            max-width: 650px;
            border-radius: 10px;
            background-color: #fddeb6;
            padding: 25px;
            border: 3px outset rgb(36, 36, 90);
        }

        h2 {
            text-align: center;
            font-size: 30px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type=text],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 6px;
            margin-bottom: 16px;
            resize: vertical;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
        }

        input[type=submit] {
            background-color: #04AA6D;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        input[type=submit]:hover {
            background-color: #45a049;
        }

        
        .navbox {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 25px;
        }

        .button {
            background-color: rgb(134, 80, 10);
            border: outset;
            color: white;
            padding: 12px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

       
        .Logout {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .btn {
            background-color: rgb(46, 34, 19);
            border: outset;
            color: white;
            padding: 12px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

        .btn:hover,
        .button:hover {
            transform: translateY(-5px);
        }

       
        @media screen and (max-width: 600px) {

            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .container {
                width: 100%;
                padding: 18px;
            }

            h2 {
                font-size: 25px;
            }

            input[type=text],
            select,
            textarea {
                font-size: 16px;
            }

            .navbox {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .button {
                width: 100%;
                text-align: center;
                padding: 12px;
            }

            .Logout {
                margin-top: 15px;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

        
        @media screen and (max-width: 350px) {

            .container {
                padding: 12px;
            }

            h2 {
                font-size: 22px;
            }

            input[type=text],
            select,
            textarea {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Contact</h2>

        <form action="action_page.php">

            <label for="fname">First Name</label>
            <input
                type="text"
                id="fname"
                name="firstname"
                placeholder="Your name.."
            >

            <label for="lname">Last Name</label>
            <input
                type="text"
                id="lname"
                name="lastname"
                placeholder="Your last name.."
            >

            <label for="country">Country</label>
            <select id="country" name="country">
                <option value="Resthouse">Resthouse</option>
                <option value="Lantungan">Lantungan</option>
                <option value="Aurora">Aurora</option>
            </select>

            <label for="subject">Comment</label>
            <textarea
                id="subject"
                name="subject"
                placeholder="Write something.."
            ></textarea>

            <div style="text-align: center;">
                <input type="submit" value="Submit">
            </div>

        </form>

        <div class="navbox">
            <a href="index.html" class="button">Home</a>
            <a href="About.html" class="button">About</a>
            <a href="Product.html" class="button">Product</a>
            <a href="Contact.html" class="button">Contact</a>
        </div>

        <div class="Logout">
            <a href="Login.html" class="btn">Logout</a>
        </div>

    </div>

</body>
</html>
