<html>
    <head>
        <style>
            .container{
                background-color: rgb(252, 226, 206);
                padding: 30px;
                border-radius: 15px;
                text-align: center;
                width: 300px;
                border: outset ;
                border-top:2px solid rgb(36, 36, 90);
                border-right: 2px solid rgb(36, 36, 90);
                border-bottom: 2px solid rgb(36, 36, 90);
                border-left: 2px solid rgb(36, 36, 90);
               
            }
             .container h2{
                margin-bottom: 50px;
                font-size: 30px;
                
            }
            input[type=text], input[type=password]{
                padding: 15px;
                width: 270px;
                margin: 8px 0;
                border: 1px solid black;
                border-radius: 5px;
                box-sizing: border-box;
            }
           input[type=submit]{
                padding: 15px;
                width: 100px;
                margin: 8px 0;
                border: 1px solid black;
                border-radius: 5px;
                box-sizing: border-box;
                background-color: black;
                color: beige;
                font-size: 10px;
                margin-top: 10px;
                font-size: 15px;
            }
            body{
                background-size: cover;
                background-position: center;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                background-image: linear-gradient(45deg, rgb(255, 214, 194), rgb(7, 20, 59), rgb(255, 216, 179), rgb(15, 23, 56));
                background-size: 400%;
                animation: gradient 5s infinite;
            }
             @keyframes gradient { 50%{background-position: 100% 50%;}}  
             @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .box {
                width: 100%;
                padding: 25px 15px;
            }

            h2 {
                font-size: 25px;
            }

            .about-content {
                flex-direction: column;
                gap: 20px;
            }

            .about-content img {
                width: 100%;
                max-width: 400px;
            }

            .about-text {
                width: 100%;
            }

            p {
                font-size: 17px;
            }

            .button {
                font-size: 14px;
                padding: 12px;
                margin: 5px 2px;
            }

            .btn {
                font-size: 14px;
                padding: 12px;
            }
        }
            
        
            
        </style>
        <title>Login form</title>
    </head>
<body>
    <div class="container">
        <h2>Login Form</h2>
        <form onsubmit="return validateForm()">
         <input type="text" id="username" name="username" placeholder="Enter Username" required>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
        <input type="submit" value="login">
        </form>
        </div>

    <script>
        function validateForm(){
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            var validUsername = "jess";
            var validPassword = "12345";

            if(username === validUsername && password === validPassword){
                window.location.href="index.html";
                return false;
            } else {
                alert("Invalid Username or password");
                return false;
            }
        }
        </script>
</body>
</html>
