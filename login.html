<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

   
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-image: linear-gradient(
                45deg,
                rgb(255, 214, 194),
                rgb(7, 20, 59),
                rgb(255, 216, 179),
                rgb(15, 23, 56)
            );

            background-size: 400%;
            animation: gradient 5s infinite;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: rgb(252, 226, 206);

            padding: 30px;
            border-radius: 15px;

            text-align: center;

           
            width: 100%;
            max-width: 360px;

            border: 2px outset rgb(36, 36, 90);
        }

        .container h2 {
            margin-bottom: 40px;
            font-size: 30px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 15px;

        
            width: 100%;

            margin: 8px 0;

            border: 1px solid black;
            border-radius: 5px;

            font-size: 16px;
        }

        input[type="submit"] {
            padding: 15px;

            width: 100%;
            max-width: 120px;

            margin-top: 15px;

            border: 1px solid black;
            border-radius: 5px;

            background-color: black;
            color: beige;

            font-size: 15px;

            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: rgb(36, 36, 90);
        }

        @keyframes gradient {
            50% {
                background-position: 100% 50%;
            }
        }


        @media (max-width: 400px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 25px 20px;
            }

            .container h2 {
                font-size: 26px;
                margin-bottom: 30px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login Form</h2>

        <form onsubmit="return validateForm()">
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <input type="submit" value="Login">
        </form>
    </div>

    <script>
        function validateForm() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            var validUsername = "jess";
            var validPassword = "12345";

            if (username === validUsername && password === validPassword) {
                window.location.href = "index.html";
                return false;
            } else {
                alert("Invalid Username or password");
                return false;
            }
        }
    </script>

</body>
</html>
