<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.12);
        }

        .container h2 {
            color: #172554;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: -18px;
            margin-bottom: 25px;
        }

        input[type="text"],
        input[type="password"] {
            padding: 14px;
            width: 100%;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
            background-color: #f8fafc;
            color: #1e293b;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background-color: #ffffff;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input[type="submit"] {
            padding: 13px;
            width: 100%;
            margin-top: 18px;
            border: none;
            border-radius: 7px;
            background-color: #1d4ed8;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #1e40af;
            transform: translateY(-2px);
        }

        .footer {
            color: #64748b;
            font-size: 13px;
            margin-top: 25px;
        }

        @media (max-width: 400px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 28px 20px;
            }

            .container h2 {
                font-size: 26px;
                margin-bottom: 28px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your account</p>

        <form onsubmit="return validateForm()">
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter Username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <input type="submit" value="Login">
        </form>

        <p class="footer">Rubik's Cube Store</p>
    </div>

    <script>
        function validateForm() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            var validUsername = "jess";
            var validPassword = "12345";

            if (username === validUsername && password === validPassword) {
                window.location.href = "index.html";
                return false;
            } else {
                alert("Invalid Username or Password");
                return false;
            }
        }
    </script>

</body>
</html>
