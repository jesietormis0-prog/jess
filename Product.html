```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: #f1f5f9;
            font-family: Arial, Helvetica, sans-serif;
            color: #1e293b;
        }

        /* Navigation Bar - Same as Home and About */
        .navbox {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            padding: 18px 15px;
            flex-wrap: wrap;
            background-color: #172554;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        /* Navigation Buttons */
        .button,
        .btn {
            color: #ffffff;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            border-radius: 8px;
            border: 1px solid #475569;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button {
            background-color: #334155;
        }

        .btn {
            background-color: #b91c1c;
            border-color: #b91c1c;
        }

        .button:hover {
            background-color: #2563eb;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            background-color: #991b1b;
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Login Form Position */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 75px);
            padding: 30px 20px;
        }

        /* Login Container */
        .container {
            background-color: #ffffff;
            padding: 35px 30px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.12);
        }

        .container h2 {
            color: #172554;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 30px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-top: -18px;
            margin-bottom: 25px;
        }

        /* Username and Password Fields */
        input[type="text"],
        input[type="password"] {
            padding: 14px;
            width: 100%;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
            background-color: #f8fafc;
            color: #1e293b;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
            background-color: #ffffff;
        }

        input::placeholder {
            color: #94a3b8;
        }

        /* Login Button */
        input[type="submit"] {
            padding: 13px;
            width: 100%;
            margin-top: 18px;
            border: none;
            border-radius: 8px;
            background-color: #1d4ed8;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        input[type="submit"]:hover {
            background-color: #1e40af;
            transform: translateY(-2px);
        }

        .footer {
            color: #64748b;
            font-size: 13px;
            margin-top: 25px;
        }

        /* Mobile Responsive Design */
        @media (max-width: 600px) {
            .navbox {
                gap: 5px;
                padding: 12px 8px;
            }

            .button,
            .btn {
                font-size: 14px;
                padding: 8px 12px;
            }

            .login-wrapper {
                min-height: calc(100vh - 60px);
                padding: 25px 15px;
            }

            .container {
                padding: 28px 20px;
            }

            .container h2 {
                font-size: 26px;
                margin-bottom: 28px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 13px;
            }
        }
    </style>
</head>

<body>

    <!-- Centered Navigation Bar -->
    <div class="navbox">
        <a href="index.html" class="button">Home</a>
        <a href="About.html" class="button">About</a>
        <a href="Product.html" class="button">Product</a>
        <a href="Contact.html" class="button">Contact</a>
        <a href="Login.html" class="btn">Logout</a>
    </div>

    <!-- Login Form -->
    <div class="login-wrapper">
        <div class="container">

            <h2>Welcome Back</h2>
            <p class="subtitle">Log in to your account</p>

            <form onsubmit="return validateForm()">

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter Password"
                    required
                >

                <input type="submit" value="Login">

            </form>

            <p class="footer">Rubik's Cube Store</p>

        </div>
    </div>

    <!-- Login Validation -->
    <script>
        function validateForm() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            var validUsername = "jess";
            var validPassword = "12345";

            if (
                username === validUsername &&
                password === validPassword
            ) {
                window.location.href = "index.html";
                return false;
            } else {
                alert("Invalid Username or Password");
                return false;
            }
        }
    </script>

</body>
</html>
